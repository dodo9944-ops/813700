<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- 모바일 고정 헤더 -->
  <header class="mobile-top-bar">
    <div class="top-bar-inner">
      <div class="top-bar-logo">
        <span class="logo-icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
            <rect x="4" y="4" width="24" height="24" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
            <path d="M10 10h5v12h-5zM17 10h5v8h-5z" fill="none" stroke="#fff" stroke-width="1.5"/>
          </svg>
        </span>
        <div class="logo-text">
          <strong>(주)세울엔지니어링</strong>
          <small>SEUL ENGINEERING</small>
        </div>
      </div>
      <button class="hamburger-btn" aria-label="메뉴">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff">
          <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 모바일 수평 스크롤 메뉴 -->
  <nav class="mobile-scroll-menu">
    <div class="scroll-menu-track">
      <a href="#company" class="menu-item">회사소개</a>
      <a href="#history" class="menu-item">세울의 길</a>
      <a href="#service" class="menu-item active">사업분야</a>
      <a href="#portfolio" class="menu-item">업무실적</a>
      <a href="#resources" class="menu-item">자료실</a>
      <a href="#community" class="menu-item">커뮤니티</a>
      <a href="#location" class="menu-item">내 위치</a>
      <a href="#feasibility" class="menu-item">사업성 검토</a>
      <a href="/pages/contact.html" class="menu-item">고객센터</a>
      <a href="#intranet" class="menu-item">인트라넷</a>
    </div>
  </nav>

  {{ content }}

  <!-- 하단 푸터 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-logo">
          <span class="logo-icon">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="26" height="26">
              <rect x="4" y="4" width="24" height="24" rx="3" fill="none" stroke="#c8a45a" stroke-width="2"/>
              <path d="M10 10h5v12h-5zM17 10h5v8h-5z" fill="none" stroke="#c8a45a" stroke-width="1.5"/>
            </svg>
          </span>
          <div class="footer-logo-text">
            <strong>(주)세울엔지니어링</strong>
            <small>SEUL ENGINEERING</small>
          </div>
        </div>

        <div class="footer-contact">
          <a href="mailto:dodo6666@naver.com">dodo6666@naver.com</a>
          <span class="footer-divider" aria-hidden="true">|</span>
          <a href="tel:010-2230-9210">010-2230-9210</a>
        </div>
      </div>

      <div class="footer-links">
        <div class="footer-privacy">
          <button type="button" class="footer-privacy-toggle" aria-expanded="false" aria-controls="footer-group-menu">
            개인정보처리방침
            <svg class="footer-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <ul id="footer-group-menu" class="footer-group-menu" hidden>
            <!-- 그룹사(계열사)별 개인정보처리방침 링크: 실제 그룹사명/URL로 교체하세요 -->
            <li><a href="#" target="_blank" rel="noopener">(주)세울엔지니어링</a></li>
          </ul>
        </div>
        <a href="/pages/contact.html" class="footer-link">고객센터</a>
      </div>

      <p class="footer-copyright">
        경기도 하남시 감일백제로 70, 204동 1104호 &nbsp;·&nbsp; Copyright &copy; (주)세울엔지니어링. All rights reserved.
      </p>
    </div>
  </footer>

  <script>
  // 푸터 개인정보처리방침 - 그룹사 연결 드롭다운
  (function() {
    var toggle = document.querySelector('.footer-privacy-toggle');
    var menu = document.getElementById('footer-group-menu');
    if (!toggle || !menu) return;

    toggle.addEventListener('click', function() {
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      menu.hidden = expanded;
    });

    document.addEventListener('click', function(e) {
      if (!toggle.contains(e.target) && !menu.contains(e.target)) {
        toggle.setAttribute('aria-expanded', 'false');
        menu.hidden = true;
      }
    });
  })();
  </script>

  <script>
  // 모바일 수평 메뉴 터치 스와이프
  (function() {
    var track = document.querySelector('.scroll-menu-track');
    if (!track) return;

    var startX = 0;
    var scrollStart = 0;
    var isDragging = false;

    track.addEventListener('touchstart', function(e) {
      isDragging = true;
      startX = e.touches[0].clientX;
      scrollStart = track.scrollLeft;
      track.style.scrollBehavior = 'auto';
    }, { passive: true });

    track.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var diff = startX - e.touches[0].clientX;
      track.scrollLeft = scrollStart + diff;
    }, { passive: true });

    track.addEventListener('touchend', function() {
      isDragging = false;
      track.style.scrollBehavior = 'smooth';
    }, { passive: true });
  })();
  </script>

</body>
</html>
