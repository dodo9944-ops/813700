name: Deploy app to GitHub Pages

# public/ 디렉터리(메타공간 + 코스피 야간선물 뷰어)를 GitHub Pages로 배포한다.
# 기본 브랜치 push 시 자동 실행되며, Actions 탭에서 수동 실행도 가능하다.
on:
  push:
    branches: ["claude/init-project-setup-sOTzo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages (자동 활성화 포함)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
